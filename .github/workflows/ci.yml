name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.10", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[test]" ruff build twine
      - run: ruff check . && ruff format --check .
      - run: pytest tests --ignore=tests/e2e -q
      - run: python -m build && twine check dist/*
  e2e:
    # Real WebRTC against a real LiveKit server, nothing faked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: LiveKit server
        run: |
          curl -sSL https://github.com/livekit/livekit/releases/download/v1.13.11/livekit_1.13.11_linux_amd64.tar.gz | tar xz
          ./livekit-server --version
      - run: pip install -e ".[test]" numpy
      - run: LIVEKIT_SERVER_BIN=$PWD/livekit-server pytest tests/e2e -q
